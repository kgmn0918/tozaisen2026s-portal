<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>対戦表 — Splathon東西戦 2026夏</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site-header">
  <div class="bar">
    <div class="brand"><span class="east">東</span>西戦 <span class="west">2026夏</span></div>
    <nav class="mainnav">
      <a href="index.html">トップ</a>
      <a href="bracket.html" class="active">対戦表</a>
      <a href="register.html">結果登録</a>
      <a href="standings.html">成績</a>
      <a href="rules.html">ルール</a>
    </nav>
  </div>
  <div class="mini-gauge" id="miniGauge"></div>
</header>

<main class="wrap" style="padding-top:48px;">
  <div class="eyebrow">Bracket</div>
  <h1 style="font-size:2rem;">対戦表</h1>
  <p class="lead">ラウンドと隊を選んで、組み合わせを確認してください。</p>

  <div class="grid-2" style="margin:24px 0;">
    <div>
      <label for="roundSelect">ラウンド</label>
      <select id="roundSelect">
        <option value="1回戦">1回戦</option>
        <option value="2回戦">2回戦</option>
        <option value="代表戦">代表戦</option>
        <option value="3回戦">3回戦</option>
      </select>
    </div>
    <div>
      <label for="corpsSelect">隊</label>
      <select id="corpsSelect">
        <option value="鉄砲">鉄砲隊</option>
        <option value="騎馬">騎馬隊</option>
      </select>
    </div>
  </div>

  <div class="card">
    <table class="data" id="matchTable">
      <thead>
        <tr><th>カード</th></tr>
      </thead>
      <tbody id="matchBody">
        <tr><td>読み込み中…</td></tr>
      </tbody>
    </table>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    この大会は、任天堂の協賛・提携を受けたものではありません。
  </div>
</footer>

<script src="assets/app.js"></script>
<script>
renderMiniGauge("miniGauge");

async function loadMatches() {
  const round = document.getElementById("roundSelect").value;
  const corps = document.getElementById("corpsSelect").value;
  const body = document.getElementById("matchBody");
  body.innerHTML = "<tr><td>読み込み中…</td></tr>";
  try {
    const matches = await apiGet("matches", { round, corps });
    if (!Array.isArray(matches) || matches.length === 0) {
      body.innerHTML = "<tr><td>この条件の対戦カードはまだ登録されていません。</td></tr>";
      return;
    }
    body.innerHTML = matches.map(m => `
      <tr>
        <td>
          <span style="color:var(--east);font-weight:700;">${m.side_a_label}</span>
          <span style="color:var(--muted);"> vs </span>
          <span style="color:var(--west);font-weight:700;">${m.side_b_label}</span>
        </td>
      </tr>
    `).join("");
  } catch (err) {
    body.innerHTML = "<tr><td>読み込みに失敗しました。時間をおいて再度お試しください。</td></tr>";
  }
}

document.getElementById("roundSelect").addEventListener("change", loadMatches);
document.getElementById("corpsSelect").addEventListener("change", loadMatches);
loadMatches();
</script>
</body>
</html>
