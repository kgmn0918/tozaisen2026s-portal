<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>結果登録 — Splathon東西戦 2026夏</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site-header">
  <div class="bar">
    <div class="brand"><span class="east">東</span>西戦 <span class="west">2026夏</span></div>
    <nav class="mainnav">
      <a href="index.html">トップ</a>
      <a href="bracket.html">対戦表</a>
      <a href="register.html" class="active">結果登録</a>
      <a href="standings.html">成績</a>
      <a href="rules.html">ルール</a>
    </nav>
  </div>
  <div class="mini-gauge" id="miniGauge"></div>
</header>

<main class="wrap" style="padding-top:48px;max-width:720px;">
  <div class="eyebrow">Register Result</div>
  <h1 style="font-size:2rem;">試合結果を登録する</h1>
  <p class="lead">対戦したマッチを選び、1〜3試合目それぞれの結果を入力してください。1マッチ = 必ず3試合分の登録が必要です。</p>

  <div class="card" style="margin-top:24px;">
    <label for="roundSelect">ラウンド</label>
    <select id="roundSelect">
      <option value="1回戦">1回戦</option>
      <option value="2回戦">2回戦</option>
      <option value="代表戦">代表戦</option>
      <option value="3回戦">3回戦</option>
    </select>

    <label for="corpsSelect">隊</label>
    <select id="corpsSelect">
      <option value="鉄砲">鉄砲隊</option>
      <option value="騎馬">騎馬隊</option>
    </select>

    <label for="matchSelect">対戦カード</label>
    <select id="matchSelect"><option value="">読み込み中…</option></select>

    <div id="gamesArea"></div>

    <button id="submitBtn" style="margin-top:24px;">3試合分をまとめて登録する</button>
    <div class="status-msg" id="statusMsg"></div>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">この大会は、任天堂の協賛・提携を受けたものではありません。</div>
</footer>

<script src="assets/app.js"></script>
<script>
renderMiniGauge("miniGauge");

const RULES = ["ガチホコ", "ガチエリア", "ガチヤグラ"];
let currentMatches = [];

function renderGamesArea() {
  const match = currentMatches.find(m => m.match_id === document.getElementById("matchSelect").value);
  const area = document.getElementById("gamesArea");
  if (!match) { area.innerHTML = ""; return; }

  area.innerHTML = [1, 2, 3].map(n => `
    <div class="card" style="margin-top:18px;background:var(--ink-deep);">
      <strong>${n}試合目</strong>
      <label>使用ルール</label>
      <select id="rule${n}">
        ${RULES.map(r => `<option value="${r}" ${n===1 && r==="ガチホコ" ? "selected":""}>${r}</option>`).join("")}
      </select>
      <label>勝利したチーム</label>
      <div class="radio-row">
        <label class="chip"><input type="radio" name="winner${n}" value="A"> ${match.side_a_label}</label>
        <label class="chip"><input type="radio" name="winner${n}" value="B"> ${match.side_b_label}</label>
      </div>
      <label class="chip" style="width:fit-content;margin-top:14px;">
        <input type="checkbox" id="ko${n}"> ノックアウトあり
      </label>
    </div>
  `).join("");
}

async function loadMatches() {
  const round = document.getElementById("roundSelect").value;
  const corps = document.getElementById("corpsSelect").value;
  const sel = document.getElementById("matchSelect");
  sel.innerHTML = "<option value=''>読み込み中…</option>";
  document.getElementById("gamesArea").innerHTML = "";
  try {
    currentMatches = await apiGet("matches", { round, corps });
    if (!Array.isArray(currentMatches) || currentMatches.length === 0) {
      sel.innerHTML = "<option value=''>対戦カードがありません</option>";
      return;
    }
    sel.innerHTML = currentMatches.map(m => `<option value="${m.match_id}">${m.side_a_label} vs ${m.side_b_label}</option>`).join("");
    renderGamesArea();
  } catch (err) {
    sel.innerHTML = "<option value=''>読み込み失敗</option>";
  }
}

document.getElementById("roundSelect").addEventListener("change", loadMatches);
document.getElementById("corpsSelect").addEventListener("change", loadMatches);
document.getElementById("matchSelect").addEventListener("change", renderGamesArea);

document.getElementById("submitBtn").addEventListener("click", async () => {
  const matchId = document.getElementById("matchSelect").value;
  if (!matchId) { showStatus("statusMsg", "対戦カードを選択してください。", false); return; }

  const games = [];
  for (const n of [1, 2, 3]) {
    const winnerInput = document.querySelector(`input[name="winner${n}"]:checked`);
    if (!winnerInput) {
      showStatus("statusMsg", `${n}試合目の勝利チームが選択されていません。`, false);
      return;
    }
    games.push({
      match_id: matchId,
      game_no: n,
      rule: document.getElementById(`rule${n}`).value,
      winner_side: winnerInput.value,
      ko: document.getElementById(`ko${n}`).checked,
    });
  }

  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.textContent = "登録中…";
  try {
    for (const g of games) {
      const res = await apiPost("submitResult", g);
      if (res.error) throw new Error(res.error);
    }
    showStatus("statusMsg", "登録が完了しました。ありがとうございます！", true);
  } catch (err) {
    showStatus("statusMsg", "登録に失敗しました。時間をおいて再度お試しください。", false);
  } finally {
    btn.disabled = false;
    btn.textContent = "3試合分をまとめて登録する";
  }
});

loadMatches();
</script>
</body>
</html>
