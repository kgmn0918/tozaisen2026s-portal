<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理者ページ — Splathon東西戦 2026夏</title>
<link rel="stylesheet" href="assets/style.css">
<meta name="robots" content="noindex">
</head>
<body>

<header class="site-header">
  <div class="bar">
    <div class="brand"><span class="east">東</span>西戦 <span class="west">2026夏</span> <span class="badge">ADMIN</span></div>
    <nav class="mainnav">
      <a href="index.html">サイトへ戻る</a>
    </nav>
  </div>
</header>

<main class="wrap" style="padding-top:48px;">

  <div id="loginArea" class="card" style="max-width:420px;">
    <h2 style="font-size:1.1rem;">管理者ログイン</h2>
    <label for="passInput">合言葉</label>
    <input type="text" id="passInput" placeholder="合言葉を入力">
    <button id="loginBtn" style="margin-top:18px;">ログイン</button>
    <div class="status-msg" id="loginStatus"></div>
  </div>

  <div id="adminArea" style="display:none;">

    <section>
      <div class="eyebrow">Publish Control</div>
      <h2 style="font-size:1.3rem;">ラウンド公開設定</h2>
      <p class="lead">ONにすると、そのラウンドの合計ポイントが成績ページに反映されます。</p>
      <div class="card" id="publishArea">読み込み中…</div>
    </section>

    <section>
      <div class="eyebrow">Results</div>
      <h2 style="font-size:1.3rem;">結果の確認・修正</h2>

      <div class="grid-2" style="margin-bottom:16px;">
        <div>
          <label for="aRound">ラウンド</label>
          <select id="aRound">
            <option value="1回戦">1回戦</option>
            <option value="2回戦">2回戦</option>
            <option value="代表戦">代表戦</option>
            <option value="3回戦">3回戦</option>
          </select>
        </div>
        <div>
          <label for="aCorps">隊</label>
          <select id="aCorps">
            <option value="鉄砲">鉄砲隊</option>
            <option value="騎馬">騎馬隊</option>
          </select>
        </div>
      </div>

      <label for="aMatch">対戦カード</label>
      <select id="aMatch"></select>

      <div class="card" style="margin-top:16px;">
        <table class="data" id="resultsTable">
          <thead><tr><th>試合</th><th>ルール</th><th>勝利</th><th>KO</th><th>登録日時</th><th></th></tr></thead>
          <tbody id="resultsBody"><tr><td colspan="6">対戦カードを選択してください</td></tr></tbody>
        </table>
      </div>
    </section>

  </div>

</main>

<script src="assets/app.js"></script>
<script>
let PASS = sessionStorage.getItem("splathon_admin_pass") || "";
let adminMatches = [];

async function tryLogin() {
  const pass = document.getElementById("passInput").value.trim();
  const res = await apiGet("adminMatches", { pass });
  if (res.error) {
    showStatus("loginStatus", "合言葉が違います。", false);
    return;
  }
  PASS = pass;
  sessionStorage.setItem("splathon_admin_pass", pass);
  document.getElementById("loginArea").style.display = "none";
  document.getElementById("adminArea").style.display = "block";
  adminMatches = res;
  initAdmin();
}

document.getElementById("loginBtn").addEventListener("click", tryLogin);
document.getElementById("passInput").addEventListener("keydown", (e) => { if (e.key === "Enter") tryLogin(); });

async function initAdmin() {
  await loadPublishArea();
  await loadMatchOptions();
}

async function loadPublishArea() {
  const rounds = ["1回戦", "2回戦", "代表戦", "3回戦"];
  const data = await apiGet("standings"); // publishedRoundsの現状取得に流用
  const published = new Set(data.publishedRounds || []);
  document.getElementById("publishArea").innerHTML = rounds.map(r => `
    <label class="chip" style="width:fit-content;margin:6px 10px 6px 0;display:inline-flex;">
      <input type="checkbox" data-round="${r}" ${published.has(r) ? "checked" : ""}>
      ${r}
    </label>
  `).join("");
  document.querySelectorAll('#publishArea input[type="checkbox"]').forEach(cb => {
    cb.addEventListener("change", async (e) => {
      await apiPost("adminPublish", { pass: PASS, round: e.target.dataset.round, published: e.target.checked });
    });
  });
}

async function loadMatchOptions() {
  const round = document.getElementById("aRound").value;
  const corps = document.getElementById("aCorps").value;
  const filtered = adminMatches.filter(m => m.round === round && m.corps === corps);
  const sel = document.getElementById("aMatch");
  sel.innerHTML = filtered.length
    ? filtered.map(m => `<option value="${m.match_id}">${m.side_a_label} vs ${m.side_b_label}</option>`).join("")
    : "<option value=''>対戦カードなし</option>";
  await loadResults();
}

async function loadResults() {
  const matchId = document.getElementById("aMatch").value;
  const body = document.getElementById("resultsBody");
  if (!matchId) { body.innerHTML = "<tr><td colspan='6'>対戦カードを選択してください</td></tr>"; return; }
  body.innerHTML = "<tr><td colspan='6'>読み込み中…</td></tr>";
  const results = await apiGet("adminResults", { matchId, pass: PASS });
  if (!Array.isArray(results) || results.length === 0) {
    body.innerHTML = "<tr><td colspan='6'>まだ登録がありません</td></tr>";
    return;
  }
  const RULES = ["ガチホコ", "ガチエリア", "ガチヤグラ"];
  body.innerHTML = results.map(r => `
    <tr data-id="${r.result_id}">
      <td>${r.game_no}</td>
      <td>
        <select class="rEdit">
          ${RULES.map(x => `<option value="${x}" ${x===r.rule?"selected":""}>${x}</option>`).join("")}
        </select>
      </td>
      <td>
        <select class="wEdit">
          <option value="A" ${r.winner_side==="A"?"selected":""}>A</option>
          <option value="B" ${r.winner_side==="B"?"selected":""}>B</option>
        </select>
      </td>
      <td><input type="checkbox" class="kEdit" ${r.ko===true||r.ko==="TRUE"?"checked":""}></td>
      <td style="font-size:0.75rem;color:var(--muted);">${r.timestamp}</td>
      <td style="white-space:nowrap;">
        <button class="secondary saveBtn" style="padding:6px 12px;font-size:0.75rem;">保存</button>
        <button class="secondary delBtn" style="padding:6px 12px;font-size:0.75rem;color:var(--east);">削除</button>
      </td>
    </tr>
  `).join("");

  body.querySelectorAll(".saveBtn").forEach(btn => btn.addEventListener("click", async (e) => {
    const tr = e.target.closest("tr");
    await apiPost("adminUpdateResult", {
      pass: PASS,
      result_id: tr.dataset.id,
      rule: tr.querySelector(".rEdit").value,
      winner_side: tr.querySelector(".wEdit").value,
      ko: tr.querySelector(".kEdit").checked,
    });
    btn.textContent = "保存済";
    setTimeout(() => btn.textContent = "保存", 1200);
  }));

  body.querySelectorAll(".delBtn").forEach(btn => btn.addEventListener("click", async (e) => {
    if (!confirm("この結果を削除しますか？")) return;
    const tr = e.target.closest("tr");
    await apiPost("adminDeleteResult", { pass: PASS, result_id: tr.dataset.id });
    loadResults();
  }));
}

document.getElementById("aRound").addEventListener("change", loadMatchOptions);
document.getElementById("aCorps").addEventListener("change", loadMatchOptions);
document.getElementById("aMatch").addEventListener("change", loadResults);

// セッション内にパスがあれば自動ログイン
if (PASS) {
  document.getElementById("passInput").value = PASS;
  tryLogin();
}
</script>
</body>
</html>
